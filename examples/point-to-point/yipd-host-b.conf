# /etc/yip/yipd.conf
# Point-to-Point Mode 1 Reference Configuration - Host B (203.0.113.2)
#
# Generates a direct, encrypted, post-quantum hybrid overlay tunnel between
# Host B and Host A without central infrastructure or external dependencies.

# ---------------------------------------------------------------------------
# 1. Local Node Identity & Cryptography
# ---------------------------------------------------------------------------
# Static X25519 node keypair (32 bytes = 64 hexadecimal characters).
# Generate with: yipd --genkey
# Keep local_private SECRET.
local_private=50b522bb0b57e7eb133e9b11b5275ea011cf8c3f4e24eb37452d192131b0e01c
local_public=9b49ffeb4566b53a0f78cae08920bc9e30a6e0c60f252cfdf4740e74f8c92b21

# Post-quantum KEM algorithm selection:
#   mlkem768  - NIST FIPS 203 Level 3 (Default, 1,184-byte EK, 1,088-byte CT)
#   mlkem1024 - NIST FIPS 203 Level 5 (High security, 1,568-byte EK, 1,568-byte CT)
#   mlkem512  - NIST FIPS 203 Level 1 (Lightweight / restricted MTU paths)
kem=mlkem768

# ---------------------------------------------------------------------------
# 2. Interface & Wire Transport
# ---------------------------------------------------------------------------
# Tunnel device interface name created in the Linux kernel.
device=yip0
device_kind=tun

# Local UDP listen address and port.
# Port 443 is selected by default to defeat port-based DPI filtering.
listen=0.0.0.0:443

# Tunnel MTU (1280 to 1420 bytes recommended for standard WAN).
mtu=1400

# Datapath worker shard count (1 = single core event loop; >1 pins worker threads).
shards=1

# Local UNIX control socket for yipctl administration and telemetry.
control_socket=/run/yipd/yip.sock

# Wire transport mode (raw UDP, quic, or tls).
transport=raw

# ---------------------------------------------------------------------------
# 3. Remote Peer Declaration: Host A
# ---------------------------------------------------------------------------
[peer]
# Host A public identity key (64 hex characters).
public_key=7df4d68205f03a2cae7e1713444fcda80ff43a29de7e9b0b4b2c159286d9a11a

# Host A public UDP endpoint.
endpoint=198.51.100.1:443

# Optional per-peer KEM override (inherits global kem=mlkem768 when omitted):
# kem=mlkem768

# Optional pinned static post-quantum encapsulation key (hex-encoded):
# pq_public_key=<hex-encoded-mlkem-encapsulation-key>
