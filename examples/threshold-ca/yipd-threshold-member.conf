# /etc/yip/yipd.conf
# Reference configuration for a mesh member enrolled in a decentralized threshold CA network.

local_private=50b522bb0b57e7eb133e9b11b5275ea011cf8c3f4e24eb37452d192131b0e01c
local_public=9b49ffeb4566b53a0f78cae08920bc9e30a6e0c60f252cfdf4740e74f8c92b21
listen=0.0.0.0:443
device=yip0
device_kind=tun

# ---------------------------------------------------------------------------
# Zero-Trust Mesh & Threshold CA Auto-Renewal
# ---------------------------------------------------------------------------
# ca_public: Set to the group verifying key produced during `dealer-gen`.
ca_public=8a03a4cf43c2907041efb394c0effabad5bdb4cbbc35d17c924c0b6cbfa8ba75

# Path to the active certificate issued by the threshold quorum.
cert=/etc/yip/node.cert

# Path to the signed root set.
roots=/etc/yip/network.roots

# Node's private signing key for epidemic gossip records.
member_sign_private=c22239d00522843313aa03a662e8f0cb6abb7889f8f103510ebb5dee0e924857

# 16-byte network identifier (32 hex characters).
network_id=f11a8e0df8fa6352eeb62192de7ece47

# Online threshold CA coordinator address.
# When configured, yipd monitors certificate expiry and automatically contacts
# the coordinator to renew the certificate at 70% elapsed TTL.
threshold_ca_server=198.51.100.10:4443

# Optional: Rendezvous server for NAT traversal
# rendezvous=198.51.100.5:443
