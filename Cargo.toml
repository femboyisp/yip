[workspace]
resolver = "2"
members = ["crates/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "AGPL-3.0-or-later"
authors = ["FEMBOY CYBER NETWORKS LLC <security@femboy.is>"]
repository = "https://github.com/femboyisp/yip"
homepage = "https://github.com/femboyisp/yip"
documentation = "https://docs.rs/yip-mesh"
keywords = ["vpn", "mesh", "fec", "cryptography", "peer-to-peer"]
categories = ["network-programming", "cryptography"]

[workspace.dependencies]
yip-wire = { version = "0.1.0", path = "crates/yip-wire" }
yip-crypto = { version = "0.1.0", path = "crates/yip-crypto" }
yip-device = { version = "0.1.0", path = "crates/yip-device" }
yip-io = { version = "0.1.0", path = "crates/yip-io" }
yip-transport = { version = "0.1.0", path = "crates/yip-transport" }
yip-membership = { version = "0.1.0", path = "crates/yip-membership" }
yip-rendezvous = { version = "0.1.0", path = "crates/yip-rendezvous" }
yip-obf = { version = "0.1.0", path = "crates/yip-obf" }
yip-utls = { version = "0.1.0", path = "crates/yip-utls" }
yip-ca = { version = "0.1.0", path = "bin/yip-ca" }

blake2 = "=0.10.6"
thiserror = "2.0.9"
tracing = "0.1.41"

[workspace.metadata.cargo-shear]
ignored = ["tracing"]

[workspace.lints.clippy]
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
as_underscore = "warn"
borrow_as_ptr = "warn"
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unicode_not_nfc = "warn"
unused_async = "deny"
wildcard_dependencies = "deny"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "deny"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "deny"
missing_abi = "deny"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
