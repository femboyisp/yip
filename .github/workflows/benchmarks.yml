---
name: benchmarks
on:
  pull_request:
    paths-ignore:
      - 'crates/yip-bench/RESULTS.md'
      - 'crates/yip-bench/wan/results/**'
      - 'assets/**'
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'crates/yip-bench/RESULTS.md'
      - 'crates/yip-bench/wan/results/**'
      - 'assets/**'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    environment: benchmark-approval
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build release
        run: cargo build --release -p yip-bench --examples
      - name: hotpath + mac_candidates (criterion, quick)
        run: |
          set -o pipefail
          cargo bench -p yip-bench --bench hotpath -- --warm-up-time 1 --measurement-time 3 | tee bench-hotpath.txt
          cargo bench -p yip-bench --bench mac_candidates -- --warm-up-time 1 --measurement-time 3 | tee bench-mac.txt
      - name: sharding_scale
        run: |
          set -o pipefail
          cargo run --release -p yip-bench --example sharding_scale | tee bench-sharding.txt
      - name: results
        if: always()
        run: |
          for f in bench-hotpath.txt bench-mac.txt bench-sharding.txt; do
            echo "::group::$f"
            cat "$f" 2>/dev/null || echo "(missing: $f)"
            echo "::endgroup::"
          done
