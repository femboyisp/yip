---
name: Mutation testing
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'bin/**'
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build prerequisites (BoringSSL needs cmake + libclang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config
      # taiki-e/install-action is not mirrored on this Forgejo instance.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Diff-scoped mutation test on PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          cargo mutants --in-diff pr.diff --in-place --baseline=skip
      - name: Mutation test (logic & control crates)
        if: github.event_name != 'pull_request'
        run: >
          cargo mutants
          --package yip-wire
          --package yip-transport
          --package yip-crypto
          --package yip-obf
          --package yip-membership
          --package yip-rendezvous
          --package yipd
          -- --all-targets
      - name: Upload mutants artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 14
