---
name: Mutation testing
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build prerequisites (BoringSSL needs cmake + libclang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config
      # taiki-e/install-action is not mirrored on this Forgejo instance.
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Mutation test (logic & control crates)
        run: >
          cargo mutants
          --package yip-wire
          --package yip-transport
          --package yip-crypto
          --package yip-obf
          --package yip-membership
          --package yip-rendezvous
          -- --all-targets
      - name: Upload mutants artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
          retention-days: 14
