[package]
name = "yip-membership"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake2 = { workspace = true }
ed25519-dalek = { version = "3", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand_core = "0.10"
# Test-only OS-CSPRNG key generation: `getrandom::SysRng` (wrapped in
# `rand_core::UnwrapErr` to satisfy ed25519-dalek 3's `CryptoRng` bound).
getrandom = { version = "0.4", features = ["sys_rng"] }

[lints]
workspace = true
