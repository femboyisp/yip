[package]
name = "yip-rendezvous"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Blind rendezvous protocol, STUN NAT traversal classification, and relay signaling for yip"

[dependencies]
blake2 = { workspace = true }
subtle = "2.6.1"
yip-membership = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand_core = "0.10"
# Test-only OS-CSPRNG key generation: `getrandom::SysRng` (wrapped in
# `rand_core::UnwrapErr` to satisfy ed25519-dalek 3's `CryptoRng` bound).
getrandom = { version = "0.4", features = ["sys_rng"] }

[lints]
workspace = true
