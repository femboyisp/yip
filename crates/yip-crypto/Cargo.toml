[package]
name = "yip-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Post-quantum hybrid Noise-IKpsk2 + ML-KEM-512 cryptographic handshake and AEAD session ciphers for yip"

[dependencies]
thiserror = { workspace = true }
snow = { version = "0.10.0", features = ["risky-raw-split"] }
ring = "0.17"
ml-kem = { version = "0.3", features = ["zeroize", "getrandom"] }
