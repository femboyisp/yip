[package]
name = "yipd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "High-performance userspace WireGuard-alternative overlay network daemon for yip"

[package.metadata.cargo-binstall]
pkg-url = "{ repo }/releases/download/v{ version }/yip-v{ version }-{ target }.tar.gz"
bin-dir = "yip-v{ version }-{ target }/{ bin }"
pkg-fmt = "tgz"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
yip-io = { workspace = true }
yip-wire = { workspace = true }
yip-crypto = { workspace = true }
yip-transport = { workspace = true }
yip-device = { workspace = true }
yip-rendezvous = { workspace = true }
yip-membership = { workspace = true }
yip-obf = { workspace = true }
blake2 = { workspace = true }
getrandom = "0.4"
libc = "0.2"
quinn-proto = { version = "0.11.16", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
bytes = { version = "1", default-features = false }
boring = "5"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
yip-utls = { workspace = true }
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yip-ca = { workspace = true }
ed25519-dalek = { version = "3" }

[dev-dependencies]
ed25519-dalek = { version = "3", default-features = false }

[lints]
workspace = true
