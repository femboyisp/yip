[package]
name = "yip-ca"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
yip-membership = { path = "../../crates/yip-membership" }
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand_core = "0.10"
# The mesh CA's key-generation OS-CSPRNG: `getrandom::SysRng` (wrapped in
# `rand_core::UnwrapErr` to satisfy ed25519-dalek 3's `CryptoRng` bound),
# not a determinism-risking substitute.
getrandom = { version = "0.4", features = ["sys_rng"] }

[lints]
workspace = true
